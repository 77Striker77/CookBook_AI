name: "🥕 Neues Rezept"
description: "Wirf ein Rezept in den Briefkasten — per Link, Foto oder Text. Der Rest passiert automatisch."
title: "[Rezept] "
labels: ["import"]
body:
  - type: markdown
    attributes:
      value: |
        Wirf einfach einen **Link** rein *oder* lade ein **Foto/Scan** hoch — mehr musst du nicht tun.
        Das landet in der Rezept-Inbox und wird beim nächsten Durchgang eingearbeitet.

        - **Instagram-Reel / TikTok:** nur den **Link** — der Rest passiert automatisch.
        - **Blog / Webseite:** nur den **Link**.
        - **YouTube:** bitte **nicht nur den Link** — YouTube blockt den automatischen Abruf.
          Häng stattdessen das **Video (mp4)** unten an *und/oder* kopier die **Videobeschreibung
          bzw. das Rezept** ins Textfeld. Daraus wird das Rezept gebaut.
        - **Ausgedrucktes / Foto:** lad es als **Foto/Scan** hoch.
  - type: input
    id: link
    attributes:
      label: "Link (Instagram-Reel, TikTok, Blog …)"
      placeholder: "https://www.instagram.com/reel/…"
    validations:
      required: false
  - type: textarea
    id: bild
    attributes:
      label: "… oder Foto / Scan / Video (mp4)"
      description: "Foto vom ausgedruckten Rezept, Screenshot — oder bei YouTube die heruntergeladene mp4 hier hineinziehen."
      placeholder: "Datei hier ablegen (GitHub lädt sie automatisch hoch)."
    validations:
      required: false
  - type: textarea
    id: text
    attributes:
      label: "… oder Rezept-Text / YouTube-Beschreibung"
      description: "Bei YouTube: die Videobeschreibung hier einfügen (da steht das Rezept oft komplett). Sonst frei lassen."
      placeholder: "Zutaten und Schritte hier einfügen …"
    validations:
      required: false
  - type: textarea
    id: notiz
    attributes:
      label: "Notiz (optional)"
      description: "Alles, was hilft — z. B. „das, was wir bei Anna gegessen haben“, Anzahl Portionen, Änderungen."
      placeholder: "Optional …"
    validations:
      required: false
