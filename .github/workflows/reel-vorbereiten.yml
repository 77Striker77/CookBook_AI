name: Reel vorbereiten

# Läuft auf GitHubs offenem Netz (nicht im gesperrten Session-Container) und
# bereitet Video-Links (Instagram-Reel, TikTok, YouTube) für die Einarbeitung
# vor: Videobilder + Ton-Transkript (oder bei YouTube notfalls die Beschreibung).
# Nutzt nur freie Werkzeuge, KEINE Claude API. Das Rezept baust du danach per /inbox.
on:
  issues:
    types: [opened, labeled]

# Formulare vergeben das Label direkt beim Anlegen -> `opened` und `labeled`
# feuern fast gleichzeitig. Ohne das hier liefe der Job doppelt (zwei Kommentare).
concurrency:
  group: reel-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  vorbereiten:
    # Nur Briefkasten-Issues mit einem Video-Link.
    if: >-
      contains(github.event.issue.labels.*.name, 'import') &&
      (contains(github.event.issue.body, 'instagram.com') ||
       contains(github.event.issue.body, 'tiktok.com') ||
       contains(github.event.issue.body, 'youtube.com') ||
       contains(github.event.issue.body, 'youtu.be'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -q --upgrade yt-dlp faster-whisper

      - name: Link & Plattform aus dem Issue ziehen
        id: link
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          URL=$(printf '%s' "$BODY" | grep -oE 'https?://[^ )]+' | grep -Ei 'instagram|tiktok|youtu' | head -1)
          case "$URL" in
            *instagram.com*)          PLATFORM="instagram" ;;
            *tiktok.com*)             PLATFORM="tiktok" ;;
            *youtube.com*|*youtu.be*) PLATFORM="youtube" ;;
            *)                        PLATFORM="sonstige" ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "Gefundener Link: $URL  (Plattform: $PLATFORM)"

      - name: Cookies bereitstellen (optional, je Plattform)
        env:
          # YouTube und Instagram brauchen je eigene Cookies; wir schreiben die
          # zur erkannten Plattform passenden in die Datei, die das Skript nutzt.
          IG_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          PLATFORM: ${{ steps.link.outputs.platform }}
        run: |
          if [ "$PLATFORM" = "youtube" ]; then
            printf '%s' "$YT_COOKIES" > /tmp/cookies.txt
          else
            printf '%s' "$IG_COOKIES" > /tmp/cookies.txt
          fi

      - name: Reel vorbereiten
        id: prep
        env:
          COOKIES_FILE: /tmp/cookies.txt
        run: |
          OUT="kochbuch/_reel-inbox/${{ github.event.issue.number }}"
          rm -rf "$OUT"
          if bash scripts/reel-prepare.sh "${{ steps.link.outputs.url }}" "$OUT"; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Material sichern (in den Branch committen)
        if: steps.prep.outputs.ok == '1'
        run: |
          git config user.name "reel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kochbuch/_reel-inbox/ || true
          if git diff --cached --quiet; then
            echo "Nichts zu committen"; exit 0
          fi
          git commit -m "Reel-Material für #${{ github.event.issue.number }}"
          for i in 1 2 3 4 5; do
            git push origin "HEAD:${{ github.event.repository.default_branch }}" && break
            git pull --rebase origin "${{ github.event.repository.default_branch }}" || true
            sleep 3
          done

      - name: Ergebnis am Issue melden
        if: always()
        uses: actions/github-script@v7
        env:
          PLATFORM: ${{ steps.link.outputs.platform }}
        with:
          script: |
            const fs = require('fs');
            const dir = `kochbuch/_reel-inbox/${context.issue.number}`;
            const platform = process.env.PLATFORM || 'sonstige';
            const read = (f) => { try { return fs.readFileSync(`${dir}/${f}`, 'utf8').trim(); } catch { return ''; } };
            const status = read('status.txt'); // voll | nur-beschreibung | fehlgeschlagen | ''

            // Plattform-spezifischer Hinweis, wenn Login/Bot-Prüfung greift.
            const cookieHinweis = {
              youtube: 'YouTube blockt die Server-IPs von GitHub gern mit „Sign in to confirm you\'re not a bot". ' +
                       'Dauerhafte Lösung: eingeloggte **YouTube**-Cookies exportieren und als Repository-Secret **`YOUTUBE_COOKIES`** hinterlegen.',
              instagram: 'Instagram verlangt für viele Reels einen Login. Dauerhafte Lösung: eingeloggte **Instagram**-Cookies ' +
                         'exportieren und als Repository-Secret **`INSTAGRAM_COOKIES`** hinterlegen.',
              tiktok: 'TikTok blockt gelegentlich Server-IPs. Du kannst TikTok-Cookies als **`INSTAGRAM_COOKIES`** hinterlegen (die Datei wird als generische Cookie-Quelle genutzt).',
              sonstige: 'Die Quelle verlangt vermutlich einen Login oder blockt Server-IPs.',
            }[platform] || 'Die Quelle verlangt vermutlich einen Login oder blockt Server-IPs.';

            let body;
            if (status === 'voll') {
              const transkript = read('transkript.txt');
              const nFrames = fs.existsSync(`${dir}/frames`) ? fs.readdirSync(`${dir}/frames`).length : 0;
              const preview = transkript.slice(0, 1500).replace(/\n/g, '\n> ');
              body = `🎬 **Video vorbereitet** — ${nFrames} Videobilder + Ton-Transkript liegen unter \`${dir}\`.\n\n` +
                     `**Transkript (Ton):**\n> ${preview || '(kein Ton erkannt)'}\n\n` +
                     `Sag jetzt **\`/inbox\`** in einer Session — dann werte ich Bilder + Transkript aus und lege das Rezept an.`;
            } else if (status === 'nur-beschreibung') {
              const caption = read('caption.txt');
              const preview = caption.slice(0, 1500).replace(/\n/g, '\n> ');
              body = `📝 **Video ließ sich nicht laden, aber die Beschreibung ist da** (unter \`${dir}\`).\n\n` +
                     `${cookieHinweis}\n\n` +
                     `Bei YouTube steht das Rezept oft komplett in der Beschreibung — das reicht meist:\n\n` +
                     `**Beschreibung:**\n> ${preview || '(leer)'}\n\n` +
                     `Sag **\`/inbox\`** — ich baue das Rezept aus der Beschreibung. Für Schritt-Bilder bräuchte ich das Video (Cookies s. o.).`;
            } else {
              body = `⚠️ **Video konnte nicht geladen werden** (Plattform: ${platform}).\n\n` +
                     `${cookieHinweis}\n\n` +
                     `**Sofort-Alternativen:**\n` +
                     `1. Das Video als \`.mp4\` hier ans Issue anhängen.\n` +
                     `2. Oder Zutaten + Schritte (bei YouTube: die Videobeschreibung) als Kommentar reinschreiben.\n\n` +
                     `Danach das Issue kurz schließen und neu öffnen (oder das Label neu setzen), dann versuche ich es erneut.`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
