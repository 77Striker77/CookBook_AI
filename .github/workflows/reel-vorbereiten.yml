name: Reel vorbereiten

# Läuft auf GitHubs offenem Netz (nicht im gesperrten Session-Container) und
# bereitet Video-Links (Instagram-Reel, TikTok) für die Einarbeitung vor:
# Videobilder + Ton-Transkript. Nutzt nur freie Werkzeuge, KEINE Claude API.
# Das Rezept baust du danach per /inbox.
#
# YouTube ist BEWUSST NICHT dabei: YouTube blockt Server-IPs (Bot-Prüfung) und
# die öffentlichen Spiegel-Dienste sind tot — der Lauf würde nur unnötig
# anstoßen und scheitern. YouTube-Rezepte lieferst du direkt am Issue (mp4
# anhängen und/oder Beschreibung/Rezept reinschreiben); /inbox baut daraus.
on:
  issues:
    types: [opened, labeled]

# Formulare vergeben das Label direkt beim Anlegen -> `opened` und `labeled`
# feuern fast gleichzeitig. Ohne das hier liefe der Job doppelt (zwei Kommentare).
concurrency:
  group: reel-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  vorbereiten:
    # Nur Briefkasten-Issues mit einem Instagram-/TikTok-Link. YouTube absichtlich
    # ausgenommen (s. Kopf) — sonst würde der Lauf bei jedem YouTube-Issue
    # unnötig anspringen und scheitern.
    if: >-
      contains(github.event.issue.labels.*.name, 'import') &&
      (contains(github.event.issue.body, 'instagram.com') ||
       contains(github.event.issue.body, 'tiktok.com'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -q --upgrade yt-dlp faster-whisper

      - name: Link & Plattform aus dem Issue ziehen
        id: link
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          URL=$(printf '%s' "$BODY" | grep -oE 'https?://[^ )]+' | grep -Ei 'instagram|tiktok' | head -1)
          case "$URL" in
            *instagram.com*)          PLATFORM="instagram" ;;
            *tiktok.com*)             PLATFORM="tiktok" ;;
            *youtube.com*|*youtu.be*) PLATFORM="youtube" ;;
            *)                        PLATFORM="sonstige" ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "Gefundener Link: $URL  (Plattform: $PLATFORM)"

      - name: Cookies bereitstellen (optional, je Plattform)
        env:
          # YouTube und Instagram brauchen je eigene Cookies; wir schreiben die
          # zur erkannten Plattform passenden in die Datei, die das Skript nutzt.
          IG_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          PLATFORM: ${{ steps.link.outputs.platform }}
        run: |
          if [ "$PLATFORM" = "youtube" ]; then
            printf '%s' "$YT_COOKIES" > /tmp/cookies.txt
          else
            printf '%s' "$IG_COOKIES" > /tmp/cookies.txt
          fi

      - name: Reel vorbereiten
        id: prep
        env:
          COOKIES_FILE: /tmp/cookies.txt
        run: |
          OUT="kochbuch/_reel-inbox/${{ github.event.issue.number }}"
          rm -rf "$OUT"
          if bash scripts/reel-prepare.sh "${{ steps.link.outputs.url }}" "$OUT"; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Material sichern (in den Branch committen)
        if: steps.prep.outputs.ok == '1'
        run: |
          git config user.name "reel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kochbuch/_reel-inbox/ || true
          if git diff --cached --quiet; then
            echo "Nichts zu committen"; exit 0
          fi
          git commit -m "Reel-Material für #${{ github.event.issue.number }}"
          for i in 1 2 3 4 5; do
            git push origin "HEAD:${{ github.event.repository.default_branch }}" && break
            git pull --rebase origin "${{ github.event.repository.default_branch }}" || true
            sleep 3
          done

      - name: Ergebnis am Issue melden
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = `kochbuch/_reel-inbox/${context.issue.number}`;
            const read = (f) => { try { return fs.readFileSync(`${dir}/${f}`, 'utf8').trim(); } catch { return ''; } };
            const status = read('status.txt'); // voll | nur-beschreibung | fehlgeschlagen | ''

            const setLabels = async (add, remove = []) => {
              for (const name of remove) {
                try {
                  await github.rest.issues.removeLabel({
                    ...context.repo, issue_number: context.issue.number, name,
                  });
                } catch (e) { /* Label war nicht dran — egal */ }
              }
              if (add.length) {
                await github.rest.issues.addLabels({
                  ...context.repo, issue_number: context.issue.number, labels: add,
                });
              }
            };
            const comment = (body) => github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body,
            });

            if (status === 'voll') {
              const transkript = read('transkript.txt');
              const nFrames = fs.existsSync(`${dir}/frames`) ? fs.readdirSync(`${dir}/frames`).length : 0;
              const preview = transkript.slice(0, 1500).replace(/\n/g, '\n> ');
              await setLabels(['bereit'], ['braucht-material', 'unklar']);
              await comment(
                `🎬 **Video vorbereitet** — ${nFrames} Videobilder + Ton-Transkript liegen unter \`${dir}\`.\n\n` +
                `**Transkript (Ton):**\n> ${preview || '(kein Ton erkannt)'}\n\n` +
                `Sag jetzt **\`/inbox\`** in einer Session — dann werte ich Bilder + Transkript aus und lege das Rezept an.`
              );
            } else if (status === 'nur-beschreibung') {
              const caption = read('caption.txt');
              const preview = caption.slice(0, 1500).replace(/\n/g, '\n> ');
              await setLabels(['bereit'], ['braucht-material', 'unklar']);
              await comment(
                `📝 **Video ließ sich nicht laden, aber die Beschreibung ist da** (unter \`${dir}\`).\n\n` +
                `**Beschreibung:**\n> ${preview || '(leer)'}\n\n` +
                `Sag **\`/inbox\`** — ich baue das Rezept aus der Beschreibung. Für Schritt-Bilder bräuchte ich das Video.`
              );
            } else {
              // Fehlschlag: KEINE Cookie-Lecture, kein "schließen & neu öffnen" —
              // nur ein kurzer, umsetzbarer Hinweis + Label, damit du es siehst.
              await setLabels(['braucht-material'], ['bereit']);
              await comment(
                `Konnte das Reel nicht automatisch laden. Damit ich es einpflegen kann, liefer bitte eins nach:\n` +
                `- die **mp4** hier anhängen, **oder**\n` +
                `- **Zutaten + Schritte** als Kommentar reinschreiben.\n\n` +
                `Danach sag **\`/inbox\`** in einer Session.`
              );
            }
