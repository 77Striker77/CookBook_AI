name: Reel vorbereiten

# Läuft auf GitHubs offenem Netz (nicht im gesperrten Session-Container) und
# bereitet Video-Links (Instagram-Reel, TikTok, YouTube) für die Einarbeitung
# vor: Videobilder + Ton-Transkript. Nutzt nur freie Werkzeuge, KEINE Claude API.
# Das eigentliche Rezept baust du danach per /inbox in einer Session.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  vorbereiten:
    # Nur Briefkasten-Issues mit einem Video-Link.
    if: >-
      contains(github.event.issue.labels.*.name, 'import') &&
      (contains(github.event.issue.body, 'instagram.com') ||
       contains(github.event.issue.body, 'tiktok.com') ||
       contains(github.event.issue.body, 'youtube.com') ||
       contains(github.event.issue.body, 'youtu.be'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -q --upgrade yt-dlp faster-whisper

      - name: Link aus dem Issue ziehen
        id: link
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          URL=$(printf '%s' "$BODY" | grep -oE 'https?://[^ )]+' | grep -Ei 'instagram|tiktok|youtu' | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Gefundener Link: $URL"

      - name: Cookies bereitstellen (optional)
        env:
          COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
        run: printf '%s' "$COOKIES" > /tmp/cookies.txt

      - name: Reel vorbereiten
        id: prep
        env:
          COOKIES_FILE: /tmp/cookies.txt
        run: |
          OUT="kochbuch/_reel-inbox/${{ github.event.issue.number }}"
          rm -rf "$OUT"
          if bash scripts/reel-prepare.sh "${{ steps.link.outputs.url }}" "$OUT"; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Material sichern (in den Branch committen)
        if: steps.prep.outputs.ok == '1'
        run: |
          git config user.name "reel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kochbuch/_reel-inbox/ || true
          if git diff --cached --quiet; then
            echo "Nichts zu committen"; exit 0
          fi
          git commit -m "Reel-Material für #${{ github.event.issue.number }}"
          for i in 1 2 3 4 5; do
            git push origin "HEAD:${{ github.event.repository.default_branch }}" && break
            git pull --rebase origin "${{ github.event.repository.default_branch }}" || true
            sleep 3
          done

      - name: Ergebnis am Issue melden
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = `kochbuch/_reel-inbox/${context.issue.number}`;
            const ok = '${{ steps.prep.outputs.ok }}' === '1' && fs.existsSync(`${dir}/transkript.txt`);
            let body;
            if (ok) {
              const transkript = fs.readFileSync(`${dir}/transkript.txt`, 'utf8').trim();
              const nFrames = fs.existsSync(`${dir}/frames`) ? fs.readdirSync(`${dir}/frames`).length : 0;
              const preview = transkript.slice(0, 1500).replace(/\n/g, '\n> ');
              body = `🎬 **Reel vorbereitet** — ${nFrames} Videobilder + Ton-Transkript liegen unter \`${dir}\`.\n\n` +
                     `**Transkript (Ton):**\n> ${preview || '(kein Ton erkannt)'}\n\n` +
                     `Sag jetzt **\`/inbox\`** in einer Session — dann werte ich Bilder + Transkript aus und lege das Rezept an.`;
            } else {
              body = `⚠️ **Reel konnte nicht geladen werden** (Instagram verlangt vermutlich Login).\n\n` +
                     `So klappt es doch:\n` +
                     `1. **Cookies hinterlegen** (dauerhafte Lösung): eingeloggte Instagram-Cookies als \`cookies.txt\` exportieren und als Repository-Secret **\`INSTAGRAM_COOKIES\`** speichern. Danach dieses Issue kurz schließen und neu öffnen (oder Label neu setzen).\n` +
                     `2. **Oder** das Video als \`.mp4\` hier anhängen bzw. die Zutaten/Schritte als Kommentar reinschreiben.`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
