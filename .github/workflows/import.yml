name: Rezept importieren (optional)

# STANDARDMÄSSIG AUS. Der normale Weg ist der /inbox-Skill in einer
# Claude-Code-Session (kein API-Key nötig) — siehe .claude/skills/inbox/.
#
# Diese Action ist nur der optionale Vollautomatik-Schalter: Setze die
# Repository-Variable AUTO_IMPORT = true UND hinterlege das Secret
# ANTHROPIC_API_KEY, dann werden Briefkasten-Issues automatisch zu PRs.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  import:
    # Nur wenn ausdrücklich aktiviert und es ein Briefkasten-Issue ist.
    if: vars.AUTO_IMPORT == 'true' && contains(github.event.issue.labels.*.name, 'import')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Rezept aus der Quelle erzeugen
        id: import
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Modell umstellbar (z. B. claude-haiku-4-5 spart Kosten): als
          # Repository-Variable CLAUDE_MODEL hinterlegen.
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: node scripts/import-rezept.mjs

      - name: Pull Request anlegen
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: kochbuch/**
          branch: rezept/${{ steps.import.outputs.slug }}
          title: "Rezept: ${{ steps.import.outputs.titel }}"
          body: |
            Automatischer Import aus Issue #${{ github.event.issue.number }}.

            ${{ steps.import.outputs.vorschau }}

            > Bitte kurz prüfen (Mengen, Zeiten, fehlende Schritte) und dann mergen.
            Schließt #${{ github.event.issue.number }}
          labels: rezept-import

      - name: Ergebnis am Issue melden
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = "${{ steps.pr.outputs.pull-request-url }}";
            const fehler = `${{ steps.import.outputs.fehler }}`;
            let body;
            if (pr) {
              body = `✅ Rezept-Vorschlag erstellt: ${pr}\n\n${`${{ steps.import.outputs.vorschau }}`}\n\nSchau kurz drüber und tippe auf **Merge** — dann ist es live.`;
            } else {
              body = `⚠️ Import hat nicht geklappt${fehler ? `: ${fehler}` : '.'}\n\nTipp: Prüfe, ob der Link öffentlich erreichbar ist, oder häng ein Foto an. Instagram-Reels mit reiner Video-Info folgen in Phase 3 — bis dahin das Video als Datei anhängen.`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
